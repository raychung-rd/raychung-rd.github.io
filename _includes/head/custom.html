{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts - Space Grotesk for headings, Inter for body text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- favicon references removed - now handled in head.html -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- CV tight spacing styles -->
<link rel="stylesheet" href="{{ '/assets/css/cv_tight_spacing.css' | relative_url }}">

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/polyfill/3.109.0/polyfill.min.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Publication modal styles and script -->
<link rel="stylesheet" href="{{ '/assets/css/publication-modal.css' | relative_url }}">
<script src="{{ '/assets/js/publication-modal.js' | relative_url }}" defer></script>

<!-- Portfolio modal styles and script -->
<link rel="stylesheet" href="{{ '/assets/css/portfolio-modal.css' | relative_url }}">
<script src="{{ '/assets/js/portfolio-modal.js' | relative_url }}" defer></script>

<!-- end custom head snippets -->
