{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts - Inter for elegant, readable typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- CV tight spacing styles -->
<link rel="stylesheet" href="{{ '/assets/css/cv_tight_spacing.css' | relative_url }}">

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/polyfill/3.109.0/polyfill.min.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Publication modal styles and script -->
<link rel="stylesheet" href="{{ '/assets/css/publication-modal.css' | relative_url }}">
<script src="{{ '/assets/js/publication-modal.js' | relative_url }}" defer></script>

<!-- Portfolio modal styles and script -->
<link rel="stylesheet" href="{{ '/assets/css/portfolio-modal.css' | relative_url }}">
<script src="{{ '/assets/js/portfolio-modal.js' | relative_url }}" defer></script>

<!-- end custom head snippets -->
